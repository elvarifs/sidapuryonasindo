<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SI DAPUR YONASINDO</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d4a2b;--bg2:#082f1c;--card:#fff;--soft:#f3f6f1;--ink:#16261d;--mut:#62736a;--line:#e3e8e1;--gold:#e0b84f;--ok:#2d9a5e;--warn:#d38e1a;--bad:#c24b3b;--r:18px}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,sans-serif}
h1,h2,h3,.brand b{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:var(--gold);z-index:99;transition:width .4s}
.logo{background:#fff;border-radius:12px;padding:4px;display:block}
.wm{text-align:center;font-size:11px;color:#9fbfae;padding:26px 12px 10px;opacity:.85}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr;position:relative;overflow:hidden;background:linear-gradient(135deg,#0d4a2b,#06301c)}
.dm{position:absolute;width:var(--s);height:var(--s);left:var(--x);top:var(--y);border:2px solid #ffffff22;transform:rotate(45deg);border-radius:14px;animation:fl var(--t) ease-in-out infinite alternate}
.dm.f{background:#ffffff0d;border:0}
@keyframes fl{to{transform:rotate(75deg) translate(26px,-34px)}}
.lside{position:relative;padding:60px;display:flex;flex-direction:column;justify-content:center;color:#fff}
.lside img{width:150px;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
.lside h1{font-size:46px;line-height:1.05;margin:26px 0 12px;animation:up .7s .15s both}
.lside p{max-width:380px;color:#b6d3c2;font-size:17px;animation:up .7s .3s both}
.lbox{position:relative;align-self:center;justify-self:center;width:min(400px,calc(100% - 32px));background:#fff;border-radius:24px;padding:34px 30px;box-shadow:0 40px 80px -30px #000b;animation:up .7s .2s both}
.lbox h2{font-size:24px}.lbox .sub{color:var(--mut);margin:4px 0 22px}
.lbox .f{animation:up .5s both}.lbox .f:nth-of-type(1){animation-delay:.45s}.lbox .f:nth-of-type(2){animation-delay:.55s}
.lbox.shake{animation:sh .4s}
.lw{position:absolute;bottom:0;left:0;right:0}
@keyframes up{from{opacity:0;transform:translateY(22px)}}
@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-8deg)}}
@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
/* form */
label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}.f{margin-bottom:14px}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ok);box-shadow:0 0 0 4px #2d9a5e22}
.btn{border:0;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--bg);color:#fff;transition:transform .15s,background .2s}
.btn:hover{background:var(--bg2)}.btn:active{transform:scale(.96)}.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn.gold{background:var(--gold);color:#2b2204}.btn.gold:hover{background:#ecc765}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:6px 12px;font-size:13px}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn[disabled]{opacity:.6;pointer-events:none}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:6px 0}
/* shell */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--bg2);color:#cfe3d7;padding:20px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:11px;align-items:center;padding:0 8px 20px}.brand img{width:54px}
.brand b{display:block;color:#fff;font-size:17px;line-height:1.1}.brand small{color:#8fb09e;font-size:12px}
.side a{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;color:inherit;cursor:pointer;margin-bottom:2px;transition:background .2s,padding .2s}
.side a:hover{background:#ffffff14;padding-left:18px}.side a.on{background:var(--gold);color:#2b2204;font-weight:700}
.side hr{border:0;border-top:1px solid #ffffff1a;margin:10px 6px}
.pill{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 8px}
main{padding:24px 30px 20px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;color:#fff}
.top h2{font-size:28px}.top small{color:#a9c6b6}.who{display:flex;align-items:center;gap:12px;font-size:13px;color:#cfe3d7;text-align:right}
.menu{display:inline-block;background:#ffffff1a;border:0;color:#fff;border-radius:12px;padding:9px 14px;font-weight:600}
.in{animation:up .45s both}
.card{background:var(--card);border-radius:var(--r);padding:20px 22px;margin-bottom:18px;box-shadow:0 12px 30px -18px #000a}
.card h3{font-size:18px}.card .sub{color:var(--mut);font-size:13px;margin:2px 0 14px}
.grid{display:grid;gap:18px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1.2fr 1fr}
.kpi{margin:0;position:relative;overflow:hidden}.kpi span{font-size:13px;color:var(--mut)}.kpi strong{display:block;font:700 34px Fraunces,serif}
.kpi::after{content:"";position:absolute;right:-18px;top:-18px;width:70px;height:70px;border-radius:18px;background:var(--c);opacity:.18;transform:rotate(45deg)}
.banner{background:var(--gold);color:#2b2204;border-radius:var(--r);padding:14px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--soft)}tr:hover td{background:#f8faf7}.n{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 11px;border-radius:99px;font-size:12px;font-weight:600}
.t-ok{background:#dcf1e5;color:#1d6b42}.t-warn{background:#f8ebcc;color:#8a5a0c}.t-bad{background:#f6dcd7;color:#8d3328}
.row{display:grid;grid-template-columns:110px 1fr 76px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
.trk{height:12px;background:var(--soft);border-radius:99px;position:relative}
.fill{height:100%;border-radius:99px;background:var(--ok);transform-origin:left;animation:gr 1s cubic-bezier(.2,.8,.2,1) both}.fill.low{background:var(--bad)}
.mk{position:absolute;top:-4px;width:2px;height:20px;background:var(--ink)}
@keyframes gr{from{transform:scaleX(0)}}
.cb{transform-origin:bottom;transform-box:fill-box;animation:gu .9s cubic-bezier(.2,.8,.2,1) both}@keyframes gu{from{transform:scaleY(0)}}
.leg{display:flex;gap:16px;font-size:12px;color:var(--mut);margin-top:6px;flex-wrap:wrap}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 14px;align-items:end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;z-index:50;animation:up .3s both;box-shadow:0 14px 30px #0006}
.empty{color:var(--mut);text-align:center;padding:26px}
.rh{display:none}
@media(max-width:900px){
.login{grid-template-columns:1fr}.lside{display:none}.lbox{margin:20px 0}
.shell{display:block}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-105%);transition:transform .25s}.side.open{transform:none}
.menu{display:inline-block}main{padding:16px 14px 10px}.g4{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.top h2{font-size:22px}.who span{display:none}.row{grid-template-columns:84px 1fr 66px}.kpi strong{font-size:28px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{body{background:#fff}.side,.top,.np,.toast,#bar{display:none!important}.shell{display:block}main{padding:0}.card{box-shadow:none;padding:0}.rh{display:flex;gap:14px;align-items:center;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:14px}.rh img{width:70px}table{min-width:0;font-size:12px}.wm{color:#444}}

#ld{position:fixed;inset:0;background:#06301cd9;backdrop-filter:blur(4px);display:grid;place-items:center;z-index:90;opacity:0;pointer-events:none;transition:opacity .25s}
#ld.on{opacity:1;pointer-events:auto}#ld>div{display:flex;flex-direction:column;align-items:center}
.lg{position:relative;width:120px;height:120px;display:grid;place-items:center}
.lg i{position:absolute;inset:8px;border:3px solid var(--gold);border-radius:20px;animation:spin 1.8s cubic-bezier(.65,0,.35,1) infinite}
.lg i+i{inset:24px;border-color:#ffffff88;border-radius:14px;animation-direction:reverse;animation-duration:1.4s}
.lg img{width:62px;background:#fff;border-radius:10px;padding:3px;animation:pulse 1.3s ease-in-out infinite}
#lt{color:#d6e8dd;margin:22px 0 0;font-weight:600}
@keyframes spin{from{transform:rotate(45deg)}to{transform:rotate(405deg)}}@keyframes pulse{50%{transform:scale(1.14)}}
.pw{position:relative}.pw input{padding-right:84px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--soft);border-radius:8px;padding:4px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--mut)}
.eye:hover{background:var(--line)}
.x{margin-left:auto;background:#ffffff18;border:0;color:#fff;border-radius:10px;width:34px;height:34px;cursor:pointer;font-size:15px}.x:hover{background:#ffffff30}
.bd{display:none}.shell.nomenu{grid-template-columns:1fr}.shell.nomenu .side{display:none}
.pv{grid-column:1/-1;background:var(--soft);border-left:4px solid var(--ok);border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:14px}
.pv b{font-size:17px}.pv.bad{border-color:var(--bad);background:#f9e5e1;color:#8d3328}
.ig{position:relative}.ig input{padding-right:70px}.un{position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;font-weight:600;pointer-events:none}
@media(max-width:900px){.bd.on{display:block;position:fixed;inset:0;background:#0009;z-index:25;animation:up .2s both}}
</style>
</head>

const t=f.dataset.type,q=+f.qty.value,u=' '+esc(it.satuan);f.querySelectorAll('.un').forEach(e=>e.textContent=it.satuan);let bad=false,s=`Stok <b>${esc(it.nama)}</b> sekarang: <b>${fmt(it.stok)}${u}</b>`;

let lt,lon=false;

const awal=b?b.after:0,masuk=inn.filter(t=>t.tipe==='tambah').reduce((a,t)=>a+t.qty,0),keluar=inn.filter(t=>t.tipe==='ambil').reduce((a,t)=>a+t.qty,0);

<form class="lbox" data-form="login" autocomplete="off"><img src="${LOGO}" class="logo" alt="" style="width:86px;margin:0 0 14px;padding:0"><h2>Selamat datang</h2><p class="sub">Masuk dengan akun Anda.</p>

<div id="view" class="${anim?'in':''}">${(V[page]||V.dashboard)()}</div>${wm}</main></div>`;anim=false;count();document.querySelectorAll('[data-form=tx]').forEach(f=>prev(f))}
function count(){document.querySelectorAll('[data-c]').forEach(e=>{const t=+e.dataset.c;if(matchMedia('(prefers-reduced-motion:reduce)').matches){e.textContent=fmt(t);return}let s=null;const f=ts=>{s=s??ts;const p=Math.min(1,(ts-s)/800);e.textContent=fmt(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}

<div class="card"><h3>Daftar user</h3><div class="tw"><table style="min-width:680px"><tr><th>Nama</th><th>Pengguna</th><th>Peran</th><th>Status</th><th>Sandi baru</th><th></th></tr>${D.users.map(u=>`<tr><td>${esc(u.nama)}</td><td>${esc(u.user)}</td><td>${ROLE[u.role]}</td><td>${u.aktif==='1'?'<span class="tag t-ok">Aktif</span>':'<span class="tag t-bad">Nonaktif</span>'}</td><td><form data-form="pw" style="display:flex;gap:6px;min-width:230px"><input type="hidden" name="id" value="${u.id}">${pwf('pw','autocomplete="new-password" style="padding:6px 84px 6px 10px"')}<button class="btn ghost sm">Ganti</button></form></td><td style="white-space:nowrap">${u.id!==D.me.id?`<button class="btn ghost sm" data-act="toggleUser" data-id="${u.id}">${u.aktif==='1'?'Nonaktifkan':'Aktifkan'}</button> <button class="btn bad sm" data-act="delUser" data-id="${u.id}">Hapus</button>`:'<small>Akun Anda</small>'}</td></tr>`).join('')}</table></div></div>`},
log(){return `<div class="card"><h3>Log aktivitas</h3><p class="sub">300 kegiatan terakhir.</p><div class="tw"><table><tr><th>Waktu</th><th>Pengguna</th><th>Kegiatan</th></tr>${LOGS.map(l=>`<tr><td style="white-space:nowrap">${fdt(l.ts)}</td><td>${esc(l.user)}</td><td>${esc(l.aksi)}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">Memuat…</td></tr>'}</table></div></div>`},
akun(){return `<div class="card" style="max-width:460px"><h3>Ganti sandi</h3><p class="sub">Gunakan sandi yang hanya Anda yang tahu.</p><form data-form="mypw" autocomplete="off"><div class="f"><label>Sandi lama</label>${pwf('old','autocomplete="current-password"')}</div><div class="f"><label>Sandi baru</label>${pwf('pw','autocomplete="new-password"')}</div><button class="btn gold">Simpan sandi</button></form></div>`}};
['awal','tambah','ambil'].forEach(t=>V[t]=()=>`<div class="card"><h3>${TY[t][0]}</h3><p class="sub">${TY[t][1]}${D.me.role==='staff'?' Catatan Anda menunggu persetujuan admin.':''}</p><form class="form" data-form="tx" data-type="${t}"><div class="pv"></div><div class="f"><label>Barang</label><select name="barang" required>${D.items.map(i=>`<option value="${i.id}">${esc(i.nama)} (stok ${fmt(i.stok)} ${esc(i.satuan)})</option>`).join('')}</select></div><div class="f"><label>${QL[t]}</label><div class="ig"><input name="qty" type="number" min="0.01" step="any" inputmode="decimal" required><span class="un"></span></div></div><div class="f"><label>Tanggal</label><input name="tanggal" type="date" required value="${today()}" max="${today()}"></div><div class="f"><label>Keterangan</label><input name="catatan" maxlength="120"></div><div class="f"><button class="btn gold">Kirim</button></div></form></div><div class="card"><h3>Catatan terakhir</h3>${txTable(D.tx.filter(x=>x.tipe===t).sort((a,b)=>b.ts-a.ts).slice(0,20),false,true)}</div>`);

/* aksi */
const acts={
go(d){page=d.p;anim=true;$('#side')?.classList.remove('open');$('.bd')?.classList.remove('on');if(page==='log')call('logs').then(r=>{LOGS=r.data;if(page==='log')render()}).catch(e=>toast(e.message));render();scrollTo(0,0)},
menu(){if(matchMedia('(max-width:900px)').matches){$('#side').classList.toggle('open');$('.bd').classList.toggle('on')}else{menuHidden=!menuHidden;$('.shell').classList.toggle('nomenu',menuHidden)}},logout(){out()},print(){window.print()},
edit(d){editItem=d.id;render()},cancel(){editItem=null;render()},
delItem(d){act('delItem',{id:d.id})},dec(d){act('decide',{id:d.id,ok:!!d.ok})},delNote(d){act('delNote',{id:d.id})},
eye(d,b){const i=b.previousElementSibling,s=i.type==='password';i.type=s?'text':'password';b.textContent=s?'Sembunyi':'Lihat'},
toggleUser(d){act('toggleUser',{id:d.id})},delUser(d){act('delUser',{id:d.id})}};
const forms={
login(f){const b=$('#lb'),box=$('.lbox');b.disabled=true;b.textContent='Memeriksa…';
ldr(true,'Memeriksa akun…');rpc('login',[f.get('u'),f.get('p')]).then(async r=>{ldr(false);if(r.ok){token=r.token;sessionStorage.setItem('sd_t',token);try{const x=await call('boot');D=x.data;page='dashboard';anim=true;render()}catch(e){out(e.message)}}else{b.disabled=false;b.textContent='Masuk';$('#lerr').textContent=r.error;box.classList.remove('shake');box.offsetHeight;box.classList.add('shake')}}).catch(()=>{ldr(false);b.disabled=false;b.textContent='Masuk';$('#lerr').textContent='Koneksi gagal. Coba lagi.'})},
item(f){act('saveItem',{id:editItem,nama:f.get('nama'),satuan:f.get('satuan'),min:f.get('min')},()=>editItem=null)},
tx(f,form){act('addTx',{tipe:form.dataset.type,barang:f.get('barang'),qty:f.get('qty'),tanggal:f.get('tanggal'),catatan:f.get('catatan')},()=>form.reset())},
note(f){act('addNote',{teks:f.get('teks')})},
user(f){act('saveUser',{nama:f.get('nama'),user:f.get('user'),role:f.get('role'),pw:f.get('pw')})},
pw(f){act('resetPw',{id:f.get('id'),pw:f.get('pw')})},
mypw(f){act('changePw',{old:f.get('old'),pw:f.get('pw')})}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&acts[b.dataset.act])acts[b.dataset.act](b.dataset,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.side a'))e.target.click()});
document.addEventListener('submit',e=>{const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();forms[f.dataset.form](new FormData(f),f)});
document.addEventListener('input',e=>{const fm=e.target.closest&&e.target.closest('[data-form=tx]');if(fm)prev(fm);if(e.target.id==='q'){const q=e.target.value.toLowerCase();document.querySelectorAll('#st tr').forEach((r,i)=>{if(i)r.style.display=r.textContent.toLowerCase().includes(q)?'':'none'})}});
document.addEventListener('change',e=>{const fm=e.target.closest&&e.target.closest('[data-form=tx]');if(fm)prev(fm);if(e.target.id==='rm'&&e.target.value){rep=e.target.value;render()}});
$('#ldimg').src=LOGO;
(async()=>{if(token){ldr(true,'Menyiapkan data…');try{D=(await call('boot')).data}catch(e){token=null}ldr(false)}render()})();
</script>
</body>
</html>
